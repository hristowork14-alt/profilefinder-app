[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 20 reached end-of-life in April 2026, so the site and functions run on Node 22 (LTS).
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Local development: `netlify dev` runs Vite and the functions behind one address.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Single-page app fallback. Function routes (/.netlify/functions/*) take priority over
# redirect rules on Netlify, so this catch-all does not swallow function calls.
# (If a function ever returns HTML instead of JSON, see "Troubleshooting" in the README.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
